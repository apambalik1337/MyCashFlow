<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a14">
<meta name="description" content="MyCashFlow — track money, understand spending, control cash flow, save more.">
<title>MyCashFlow — Smart Spending Wallet</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app">
  <!-- ================= SIDEBAR ================= -->
  <aside class="nav" id="nav">
    <div class="brand">
      <div class="brand-mark">💸</div>
      <div>
        <div class="brand-name">MyCashFlow</div>
        <div class="brand-sub">Smart Wallet</div>
      </div>
    </div>

    <div class="nav-lbl">Overview</div>
    <button class="nav-item" data-go="dashboard"><span class="nav-ic">📊</span> Dashboard</button>
    <button class="nav-item" data-go="analytics"><span class="nav-ic">📈</span> Analytics</button>
    <button class="nav-item" data-go="calendar"><span class="nav-ic">📅</span> Calendar</button>

    <div class="nav-lbl">Money</div>
    <button class="nav-item" data-go="income"><span class="nav-ic">💵</span> Income</button>
    <button class="nav-item" data-go="spending"><span class="nav-ic">🛒</span> Spending Wallet</button>
    <button class="nav-item" data-go="wallets"><span class="nav-ic">👝</span> Wallets</button>
    <button class="nav-item" data-go="history"><span class="nav-ic">🧾</span> History</button>

    <div class="nav-lbl">Plan</div>
    <button class="nav-item" data-go="budgets"><span class="nav-ic">🎯</span> Budgets</button>
    <button class="nav-item" data-go="goals"><span class="nav-ic">🏆</span> Savings Goals</button>
    <button class="nav-item" data-go="recurring"><span class="nav-ic">🔁</span> Recurring</button>

    <div class="nav-foot">
      <button class="nav-item" data-go="settings"><span class="nav-ic">⚙️</span> Settings</button>
      <div class="row g10 mt12" style="padding:8px 12px">
        <div class="cat-av cat-av-sm" style="background:var(--grad-brand);border:none">👤</div>
        <div class="grow truncate">
          <div class="t-sm w6 truncate" id="userName">Alex</div>
          <div class="t-xs dim">Personal account</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ================= MAIN ================= -->
  <div class="main">
    <header class="hd">
      <button class="burger" id="burger" aria-label="Open menu">☰</button>
      <div class="grow truncate">
        <div class="hd-title" id="pgTitle">Dashboard</div>
        <div class="hd-sub" id="pgSub">Your financial overview</div>
      </div>

      <div class="seg mob-hide" id="monthSeg"></div>

      <div class="rel">
        <button class="ibtn" id="bellBtn" aria-label="Notifications" style="width:38px;height:38px;background:var(--glass);border:1px solid var(--glass-brd);font-size:1rem">
          🔔<span class="nav-badge hidden" id="bellDot" style="position:absolute;top:-4px;right:-4px;margin:0"></span>
        </button>
        <div id="notifPop"></div>
      </div>

      <button class="btn btn-p btn-sm mob-hide" id="quickAdd">＋ <span>Add</span></button>
    </header>

    <main class="view" id="view"></main>
  </div>
</div>

<!-- ================= FAB ================= -->
<div class="fab-zone">
  <div class="fab-menu" id="fabMenu">
    <button class="fab-act" data-fab="income"><span class="fab-act-ic" style="background:var(--up-dim);color:var(--up)">↓</span> Add Income</button>
    <button class="fab-act" data-fab="expense"><span class="fab-act-ic" style="background:var(--down-dim);color:var(--down)">↑</span> Add Expense</button>
    <button class="fab-act" data-fab="transfer"><span class="fab-act-ic" style="background:var(--info-dim);color:var(--info)">⇄</span> Transfer Money</button>
    <button class="fab-act" data-fab="savings"><span class="fab-act-ic" style="background:var(--warn-dim);color:var(--warn)">🏆</span> Add Savings</button>
  </div>
  <button class="fab" id="fab" aria-label="Quick add">＋</button>
</div>

<div class="toasts" id="toasts"></div>
<div id="modalRoot"></div>

<script src="js/store.js"></script>
<script src="js/charts.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages.js"></script>
<script src="js/app.js"></script>
</body>
</html>
